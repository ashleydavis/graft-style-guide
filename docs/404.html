<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Graft Style Explorer</title>
        <!--
            Sets the explorer theme kept in this browser's storage before the first paint, so a
            refresh in the light theme draws light from the start. Dark is the default.
        -->
        <script>
            try {
                document.documentElement.className = JSON.parse(localStorage.getItem("graft-style-guide-settings") || "{}").explorer === "light" ? "light" : "dark";
            }
            catch {
                document.documentElement.className = "dark";
            }
        </script>
        <!--
            Loads the tokens before the first paint, and paints the page background from them
            while the app's script loads.
        -->
        <style>
            html {
                background: var(--color-bg);
            }
        </style>
      <script type="module" crossorigin src="/graft-style-guide/assets/index-C_48nSPS.js"></script>
      <link rel="stylesheet" crossorigin href="/graft-style-guide/assets/index-B3NgjbqI.css">
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
